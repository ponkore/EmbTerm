[workspace]
resolver = "3"
# クレートを作ったら足す（中身の無いディレクトリを glob で指すと Cargo がエラーにする）
members = [
    "spikes/vt-link",
    "spikes/vt-module",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"

[workspace.dependencies]
windows = "0.62"
emacs = { version = "0.23", features = ["emacs-28"] }
thiserror = "2"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
# Emacs module で panic を catch_unwind するため、panic = "abort" にはしない
