[package]
name = "et-vt"
description = "libghostty-vt の FFI（使う範囲だけ手書き）と安全なラッパ"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
links = "ghostty-vt"

[dependencies]

# PNG のデコード（Kitty graphics）に WIC を使う。macOS は未実装（T-124。ImageIO にするのは T-127）
[target.'cfg(windows)'.dependencies.windows]
workspace = true
features = [
    "Win32_Foundation",
    "Win32_Graphics_Imaging",
    "Win32_System_Com",
]
