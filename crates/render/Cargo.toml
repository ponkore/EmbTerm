[package]
name = "et-render"
description = "端末の画面を描く（Windows: Direct2D / DirectWrite、macOS: Metal + CoreText。T-125）"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
et-vt = { path = "../vt" }

[target.'cfg(windows)'.dependencies]
windows-numerics = "0.3"

# macOS: Metal（描画）+ CoreText（フォント）+ QuartzCore（CAMetalLayer）。T-125
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-metal = "0.3"
objc2-quartz-core = { version = "0.3", features = ["CAMetalLayer", "CALayer", "objc2-metal"] }
objc2-core-text = "0.3"
objc2-core-graphics = "0.3"
objc2-core-foundation = "0.3"


[target.'cfg(windows)'.dependencies.windows]
workspace = true
features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_System_Threading",
]
