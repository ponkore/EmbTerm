<svg xmlns="http://www.w3.org/2000/svg" width="820" height="632" viewBox="0 0 820 632" role="img" aria-labelledby="t d">
  <title id="t">EmbTerm の全体像</title>
  <desc id="d">Emacs のプロセスの中で、Lisp のスレッドが embterm_module.dll に頼みごとを送り、module の UI スレッドが子 HWND に端末を描く。module の et-session のスレッドが ConPTY を通して子プロセスと読み書きする。</desc>

  <style>
    :root {
      --bg:    #ffffff;
      --fg:    #1f2328;
      --muted: #57606a;
      --line:  #8c959f;
      --outer-fill:   #f6f8fa;
      --outer-stroke: #afb8c1;
      --lisp-fill:    #eaf2fb;
      --lisp-stroke:  #9ab6d8;
      --mod-fill:     #ffffff;
      --mod-stroke:   #afb8c1;
      --inner-fill:   #f6f8fa;
      --inner-stroke: #c6cdd5;
      --child-fill:   #fdf4e3;
      --child-stroke: #d9b974;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg:    #0d1117;
        --fg:    #e6edf3;
        --muted: #9198a1;
        --line:  #6e7681;
        --outer-fill:   #161b22;
        --outer-stroke: #3d444d;
        --lisp-fill:    #152233;
        --lisp-stroke:  #3f648c;
        --mod-fill:     #0d1117;
        --mod-stroke:   #3d444d;
        --inner-fill:   #161b22;
        --inner-stroke: #3d444d;
        --child-fill:   #241e12;
        --child-stroke: #7a6433;
      }
    }
    text {
      font-family: system-ui, -apple-system, "Segoe UI", "Yu Gothic UI", Meiryo, sans-serif;
      font-size: 13px;
      fill: var(--fg);
    }
    .h     { font-size: 14px; font-weight: 600; }
    .mono  { font-family: ui-monospace, Consolas, "Cascadia Mono", "Courier New", monospace; }
    .muted { fill: var(--muted); }
    .small { font-size: 12px; }
    .arrow { stroke: var(--line); stroke-width: 1.6; fill: none; }
  </style>

  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--line)"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="820" height="632" fill="var(--bg)"/>

  <!-- Emacs のプロセス -->
  <rect x="20" y="20" width="780" height="490" rx="10" fill="var(--outer-fill)" stroke="var(--outer-stroke)"/>
  <text class="h" x="38" y="44">Emacs のプロセス</text>

  <!-- Lisp のスレッド -->
  <rect x="44" y="58" width="732" height="132" rx="8" fill="var(--lisp-fill)" stroke="var(--lisp-stroke)"/>
  <text class="h" x="62" y="82">Lisp のスレッド</text>
  <text class="mono muted small" x="62" y="102">lisp/embterm.el</text>
  <text x="74" y="124">・キーを受けて端末に送る（semi-char モード）</text>
  <text x="74" y="144">・ペインの置き場所を送る（<tspan class="mono">window-*-change-functions</tspan>）</text>
  <text x="74" y="164">・設定（フォント・色・カーソル・テーマ）を送る</text>
  <text x="74" y="182">・module の知らせを受けて <tspan class="mono">embterm-module-poll</tspan> で読む</text>

  <!-- Lisp ←→ module -->
  <path class="arrow" d="M 130 198 L 130 280" marker-end="url(#head)" marker-start="url(#head)"/>
  <text x="150" y="226">↓ 頼みごと（列に積んで <tspan class="mono">PostMessage</tspan>。待たない）</text>
  <text x="150" y="254">↑ 変化の知らせ（<tspan class="mono">open_channel</tspan> のパイプに 1 バイト）</text>

  <!-- module -->
  <rect x="44" y="288" width="732" height="200" rx="8" fill="var(--mod-fill)" stroke="var(--mod-stroke)"/>
  <text class="h mono" x="62" y="312">embterm_module.dll</text>

  <rect x="64" y="324" width="692" height="74" rx="6" fill="var(--inner-fill)" stroke="var(--inner-stroke)"/>
  <text class="h" x="82" y="346">UI スレッド（端末 1 つにつき 1 本）</text>
  <text x="94" y="366">・制御用ウィンドウ（<tspan class="mono">HWND_MESSAGE</tspan>）が頼みごとと出力の知らせを受ける</text>
  <text x="94" y="386">・ペイン = Emacs のウィンドウごとの子 HWND に Direct2D で描く</text>

  <path class="arrow" d="M 130 422 L 130 402" marker-end="url(#head)"/>
  <text class="small muted" x="150" y="418">出力の知らせ（まとめて 1 回だけ）</text>

  <rect x="64" y="424" width="692" height="56" rx="6" fill="var(--inner-fill)" stroke="var(--inner-stroke)"/>
  <text class="h" x="82" y="446">et-session のスレッド（読み / 書き）</text>
  <text x="94" y="468">・読む → 端末をロックして libghostty-vt に渡す　・応答とキーを PTY に書く</text>

  <!-- ConPTY -->
  <path class="arrow" d="M 130 512 L 130 552" marker-end="url(#head)" marker-start="url(#head)"/>
  <text x="150" y="536">ConPTY（再配布版 <tspan class="mono">conpty.dll</tspan> + <tspan class="mono">OpenConsole.exe</tspan> を優先）</text>

  <!-- 子プロセス -->
  <rect x="44" y="556" width="732" height="56" rx="8" fill="var(--child-fill)" stroke="var(--child-stroke)"/>
  <text class="h" x="62" y="578">子プロセス（Job Object の中）</text>
  <text x="74" y="598">pwsh / cmd / nyagos / Git Bash / WSL / claude / vim / yazi …</text>
</svg>
