[package]
name = "embterm-module"
description = "EmbTerm の Emacs dynamic module（embterm_module.dll。T-028）"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "embterm_module"
crate-type = ["cdylib"]

[dependencies]
emacs.workspace = true
et-vt = { path = "../../crates/vt" }
et-session = { path = "../../crates/session" }

[target.'cfg(windows)'.dependencies]
et-render = { path = "../../crates/render" }

# macOS: ビューのレイヤーに重ねる（T-126）
[target.'cfg(target_os = "macos")'.dependencies]
et-render = { path = "../../crates/render" }
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSWindow", "NSView", "NSResponder", "NSGraphics"] }
objc2-foundation = "0.3"
objc2-quartz-core = { version = "0.3", features = ["CAMetalLayer", "CALayer", "objc2-metal"] }
objc2-core-foundation = "0.3"
libc = "0.2"

[target.'cfg(windows)'.dependencies.windows]
workspace = true
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
]
