[package]
name = "embterm"
description = "EmbTerm のデバッグ用 exe（トップレベルのウィンドウ 1 枚に端末 1 つ。T-027）"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "embterm"
path = "src/main.rs"

[dependencies]
et-vt = { path = "../../crates/vt" }
et-pty = { path = "../../crates/pty" }
et-render = { path = "../../crates/render" }

[dependencies.windows]
workspace = true
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
]
