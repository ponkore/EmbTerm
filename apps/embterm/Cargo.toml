[package]
name = "embterm"
description = "EmbTerm のデバッグ用 exe（トップレベルのウィンドウ 1 枚に端末 1 つ。T-027）"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "embterm"
path = "src/main.rs"

[dependencies]
et-vt = { path = "../../crates/vt" }
et-pty = { path = "../../crates/pty" }
et-session = { path = "../../crates/session" }

[target.'cfg(windows)'.dependencies]
et-render = { path = "../../crates/render" }

# macOS: 描画（CoreText + Metal。T-125）と窓（AppKit）
[target.'cfg(target_os = "macos")'.dependencies]
et-render = { path = "../../crates/render" }
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSWindow", "NSView", "NSResponder", "NSEvent", "NSRunningApplication", "NSGraphics", "NSScreen", "NSMenu", "NSMenuItem", "NSColor", "NSColorSpace"] }
objc2-quartz-core = { version = "0.3", features = ["CAMetalLayer", "CALayer", "objc2-metal"] }
objc2-core-foundation = "0.3"

[target.'cfg(windows)'.dependencies.windows]
workspace = true
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
]
